name: Publish Plugin to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: "${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}"
    environment: pypi
    permissions:
      id-token: write  # For trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          version: "0.12.23"
      - name: Read coordinated release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release-metadata.py > "$RUNNER_TEMP/release-manifest.json"
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: marimo-team/internal-gh-actions/validate-release@3a52681ab8e200a34175ec8e5d14985e4e7ce3c3
        with:
          manifest: ${{ runner.temp }}/release-manifest.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: |
          cd plugin
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        with:
          packages-dir: plugin/dist/

      - name: Notify release result
        if: always()
        uses: marimo-team/internal-gh-actions/release-notification@3a52681ab8e200a34175ec8e5d14985e4e7ce3c3
        with:
          status: ${{ job.status }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_RELEASES }}
          artifact-url: "https://pypi.org/project/kubectl-marimo/"
