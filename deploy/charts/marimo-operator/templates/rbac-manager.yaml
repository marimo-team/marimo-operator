{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "marimo-operator.fullname" . }}-manager-role
  labels:
    {{- include "marimo-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - pods
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - marimo.io
  resources:
  - marimos
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - marimo.io
  resources:
  - marimos/finalizers
  verbs:
  - update
- apiGroups:
  - marimo.io
  resources:
  - marimos/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "marimo-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "marimo-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "marimo-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "marimo-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
