{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "marimo-operator.fullname" . }}-allow-metrics-traffic
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marimo-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "marimo-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.fromNamespaceLabels | nindent 14 }}
      ports:
        - port: {{ .Values.networkPolicy.metricsPort }}
          protocol: TCP
{{- end }}
